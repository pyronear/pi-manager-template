---
# Tasks to deploy Docker Compose files
# A first deploy has neither the directory nor a compose file, so the teardown
# below has nothing to act on and errors out; skip it until one exists.
- name: Check whether a previous deployment exists
  ansible.builtin.stat:
    path: /home/{{ app_name }}/docker-compose.yml
  register: existing_compose

- name: Stop all services
  community.docker.docker_compose_v2:
    project_src: /home/{{ app_name }}/
    state: absent
    remove_images: all
  when: existing_compose.stat.exists

- name: Create a directory if it does not exist
  ansible.builtin.file:
    path: /home/{{ app_name }}
    state: directory
    mode: '0755'

- name: Create empty acme file
  ansible.builtin.copy:
    content: ""
    dest: /home/{{ app_name }}/acme.json
    force: false
    group: sys
    mode: 0600

- name: Copy .env file
  ansible.builtin.template:
    src: ".env.{{ app_name }}.j2"
    dest: /home/{{ app_name }}/.env
    mode: '0644'

- name: Copy docker-compose file
  ansible.builtin.template:
    src: "docker-compose.{{ app_name }}.yml.j2"
    dest: /home/{{ app_name }}/docker-compose.yml
    mode: '0644'

- name: Log into DockerHub
  community.docker.docker_login:
    username: pyronear
    password: '{{ dockerhub_password }}'


- name: Ensure Docker Compose containers are running
  community.docker.docker_compose_v2:
    project_src: /home/{{ app_name }}/
    wait: true
