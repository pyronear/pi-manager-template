---
- name: Assert required twenty variables are set
  ansible.builtin.assert:
    that:
      - twenty_pg_password | default('', true) | length > 0
      - twenty_encryption_key | default('', true) | length > 0
      - twenty_app_secret | default('', true) | length > 0
      - twenty_backup_passphrase | default('', true) | length > 0
      - twenty_s3_bucket | default('', true) | length > 0
      - twenty_s3_access_key | default('', true) | length > 0
      - twenty_s3_secret_key | default('', true) | length > 0
    fail_msg: >-
      Missing twenty configuration. Set twenty_pg_password, twenty_encryption_key,
      twenty_app_secret, twenty_backup_passphrase and the twenty_s3_* vars in the
      sister repo vault before deploying.
    quiet: true

- name: Install gpg (backup encryption)
  ansible.builtin.apt:
    name: gnupg
    state: present

- name: Create the shared web network
  community.docker.docker_network:
    name: web

- name: Create working directory
  ansible.builtin.file:
    path: "{{ twenty_working_dir }}"
    state: directory
    mode: "0750"

- name: Copy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ twenty_working_dir }}/docker-compose.yml"
    mode: "0644"

- name: Copy secret env files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ twenty_working_dir }}/{{ item }}"
    mode: "0600"
  with_items:
    - .env
    - backup.env
  no_log: true

- name: Install backup and restore scripts
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /usr/local/bin/{{ item }}
    mode: "0755"
  with_items:
    - twenty-backup.sh
    - twenty-restore.sh

- name: Docker Compose start and verify containers are running
  community.docker.docker_compose_v2:
    project_src: "{{ twenty_working_dir }}"
    wait: true
    wait_timeout: 600

- name: Copy last-contact trigger
  ansible.builtin.copy:
    src: last_contact_trigger.sql
    dest: "{{ twenty_working_dir }}/last_contact_trigger.sql"
    mode: "0644"

# Only workspaces that have the custom company field the trigger writes to
- name: Find workspace schemas with the lastContactAt field
  ansible.builtin.command:
    cmd: >-
      docker compose exec -T db psql -U postgres -d default -tA -c
      "select table_schema from information_schema.columns
      where table_name = 'company' and column_name = 'lastContactAt'"
    chdir: "{{ twenty_working_dir }}"
  register: twenty_schemas
  changed_when: false

- name: Install the last-contact trigger
  ansible.builtin.shell:
    cmd: >-
      docker compose exec -T db psql -U postgres -d default -v ON_ERROR_STOP=1 -q
      -v schema={{ item }} -f - < last_contact_trigger.sql
    chdir: "{{ twenty_working_dir }}"
  with_items: "{{ twenty_schemas.stdout_lines }}"
  changed_when: false

- name: Schedule the nightly backup
  ansible.builtin.cron:
    name: twenty backup
    hour: "{{ twenty_backup_hour }}"
    minute: "{{ twenty_backup_minute }}"
    job: /usr/local/bin/twenty-backup.sh 2>&1 | logger -t twenty-backup

- name: Install the Monday weekly report
  when: twenty_api_key | default('', true) | length > 0
  block:
    - name: Copy the weekly report script
      ansible.builtin.copy:
        src: twenty-weekly.py
        dest: /usr/local/bin/twenty-weekly.py
        mode: "0755"

    - name: Copy the weekly report config
      ansible.builtin.template:
        src: weekly.env.j2
        dest: "{{ twenty_working_dir }}/weekly.env"
        mode: "0600"
      no_log: true

    - name: Schedule the weekly report on Monday morning
      ansible.builtin.cron:
        name: twenty weekly
        weekday: "1"
        hour: "{{ twenty_weekly_hour }}"
        minute: "0"
        job: >-
          /bin/sh -c 'set -a; . {{ twenty_working_dir }}/weekly.env;
          exec python3 /usr/local/bin/twenty-weekly.py' 2>&1 | logger -t twenty-weekly
