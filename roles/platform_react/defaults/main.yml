platform_react_working_dir_react: /home/pyro_platform_react
platform_react_docker_image: pyronear/pyro-platform-react
platform_react_docker_version: 0.8.3

platform_react_url_frontend: TO_CHANGE
platform_react_url_backend: TO_CHANGE
platform_react_url_livestream: TO_CHANGE
platform_react_api_timeout_ms: 4000
platform_react_control_camera_timeout_ms: 10000
# IGN Geoplateforme key (https://data.geopf.fr/private/wmts): enables the IGN Topo
# base layer, the layer stays hidden when empty. The key is referrer-restricted,
# so every origin serving the app must be allow-listed in the IGN client space,
# or the tiles come back 401. Empty by default so a deployment without the key still works.
platform_react_ign_api_key: ""
