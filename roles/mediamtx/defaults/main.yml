---
mediamtx_config_path: /opt/mediamtx
mediamtx_config_file: "{{ mediamtx_config_path }}/mediamtx.yml"
mediamtx_image: bluenviron/mediamtx
mediamtx_users: [] # utiliser le json qui est dans la plateforme ?
mediamtx_paths: []
# Set to a DNS name to expose WebRTC over HTTPS through the co-hosted shared
# traefik (requires the traefik role on the same host)
mediamtx_livestream_hostname: ''
# WebRTC ICE reachability. By default mediamtx only advertises the host's local
# interface IPs as ICE candidates, so a viewer that is not on the same network
# (e.g. not on the VPN) cannot reach the media. On a NAT'd public host, list the
# public IP(s)/hostname(s) here so they are advertised too. Set the TCP address
# to also serve WebRTC media over TCP (useful when only a TCP port is opened).
mediamtx_webrtc_additional_hosts: []
mediamtx_webrtc_tcp_address: ''
# SRT ingest listen address (mediamtx default ':8890', all interfaces). Set to
# '127.0.0.1:8890' when the only publisher is an engine on this same host, so
# nobody else can publish to the stream paths.
mediamtx_srt_address: ''
# Must match the traefik role defaults (shared reverse proxy)
traefik_dynamic_dir: "{{ traefik_working_dir | default('/home/traefik') }}/dynamic"
